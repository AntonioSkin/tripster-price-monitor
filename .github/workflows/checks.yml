name: Price monitor safety checks
on:
  push:
    paths: ['*.py', '.github/workflows/*.yml']
  pull_request:
    paths: ['*.py', '.github/workflows/*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest test_safe_monitor -v
