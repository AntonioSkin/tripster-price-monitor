name: Tripster Price Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['monitor.py', 'safe_monitor.py', 'persist_bundle.py', 'test_safe_monitor.py', '.github/workflows/monitor.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: tripster-task-7
  queue: max
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      bundle: ${{ steps.upload.outcome == 'success' }}
      artifact: ${{ steps.bundle.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Test price completeness and durable delivery protection
        run: python -m unittest test_safe_monitor -v
      - name: Check all prices and preserve delivery reservations
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          MONITOR_BUNDLE: ${{ runner.temp }}/monitor-bundle
        run: python safe_monitor.py
      - name: Name the immutable task 7 bundle
        id: bundle
        if: always()
        run: echo "artifact=monitor-task-7-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: ${{ runner.temp }}/monitor-bundle/
          if-no-files-found: error
          retention-days: 14
  save:
    needs: collect
    if: ${{ always() && needs.collect.outputs.bundle == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.collect.outputs.artifact }}
          path: ${{ runner.temp }}/monitor-bundle
      - name: Save prices and verified completion evidence
        run: python persist_bundle.py "$RUNNER_TEMP/monitor-bundle"

